experiment:
  name: train_hpa_mito_resnet18
  output_root: results
  seed: 42

data:
  manifest_paths:
    - data/metadata/hpa_patches.csv
  source:
    - hpa
  target_organelle: mito
  image_size: 128
  input_channels: 1
  crop_mode: center
  normalize_mode: percentile
  percentile_low: 1.0
  percentile_high: 99.0
  exclude_quality_flags:
    - low_signal
  split:
    use_predefined: false
    group_col: split_group
    seed: 42
    train_frac: 0.7
    val_frac: 0.15
    test_frac: 0.15

loader:
  batch_size: 64
  num_workers: 0

model:
  arch: resnet18
  in_channels: 1
  pretrained: false

train:
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  pos_weight: auto
  threshold: 0.5
  scheduler:
    name: cosine
    min_lr: 0.000001
  resume_ckpt:
